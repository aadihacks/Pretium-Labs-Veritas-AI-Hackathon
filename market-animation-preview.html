<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pretium Labs — Market animations</title>
  <style>
    *{box-sizing:border-box;}
    body{margin:0;background:#030812;color:#e7f0f9;font:500 14px/1.5 system-ui,sans-serif;}
    main{max-width:72rem;margin:auto;padding:clamp(20px,4vw,56px);}
    h1{font-size:clamp(24px,4vw,40px);font-weight:500;}
    .controls{display:flex;flex-wrap:wrap;gap:12px;}
    button{min-height:44px;padding:10px 18px;background:#142338;color:inherit;border:1px solid #53647a;border-radius:8px;font:inherit;cursor:pointer;}
    button:focus-visible{outline:3px solid #21df7d;outline-offset:3px;}
    #previewStatus{min-height:1.5em;color:#a8b8c9;}
  </style>
</head>
<body>
  <main>
    <h1>Market animations</h1>
    <div class="controls" aria-label="Replay a market animation">
      <button type="button" data-pattern="Up">Up</button>
      <button type="button" data-pattern="Sideways">Sideways</button>
      <button type="button" data-pattern="Breakout">Breakout</button>
      <button type="button" data-pattern="Volatility spike">Volatility spike</button>
      <button type="button" data-pattern="Reversal">Reversal</button>
    </div>
    <p id="previewStatus" role="status" aria-live="polite"></p>
  </main>
  <script src="./market-celebrations.js?v=8"></script>
  <script>
    document.querySelectorAll('[data-pattern]').forEach(button => {
      button.addEventListener('click', () => {
        const duration = playCorrectMarketCelebration(button.dataset.pattern);
        document.getElementById('previewStatus').textContent = `${button.dataset.pattern} · ${(duration / 1000).toFixed(2)} seconds`;
      });
    });
  </script>
</body>
</html>
